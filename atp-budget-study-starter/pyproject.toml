[project]
name = "atp-budget-study"
version = "0.1.0"
description = "Budget-bounded agentic theorem proving: fixed-budget ablation + learned controller"
requires-python = ">=3.11"
dependencies = [
    # --- pin exact versions during Task 0.1 and record in DECISIONS.md ---
    "lean-dojo",            # Lean 4 interaction + premise data
    "vllm",                 # inference server for the 8B provers
    "openai",               # client for the vLLM OpenAI-compatible endpoint
    "transformers",
    "torch",
    "trl",                  # Phase 2 GRPO/DPO (or replace with a minimal loop)
    "peft",                 # LoRA/QLoRA for Phase 2
    "datasets",
    "huggingface-hub",
    "omegaconf",            # config system (or pydantic — decide in Task 0.1)
    "pydantic>=2",
    "numpy",
    "pandas",
    "matplotlib",           # pass@B curves
    "rank-bm25",            # retrieval baseline
    "tenacity",             # retries around flaky Lean/server calls
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "ruff", "pre-commit"]

[project.scripts]
atp = "atp.cli:main"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a couple seconds",
    "gpu: tests that require a GPU",
    "lean: tests that require a working Lean/LeanDojo install",
]
# Fast suite (login-node safe) = run without slow/gpu/lean:
#   pytest -m "not slow and not gpu and not lean"
# Full suite (on a GPU node):
#   pytest

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
