# configs/phase0_baseline.yaml — Phase 0 exit: minimal-agent baseline pass@B curve.
# Minimal loop only (no memory/reviewer/retrieval/skeletons). Audited miniF2F test, 3 seeds.

defaults: base

data:
  benchmark: minif2f
  split: test
  exclude_unprovable: true
  use_novel_split: false

budget:
  values: [2000, 8000, 32000, 128000]

eval:
  seeds: [0, 1, 2]

agent:
  mode: whole_proof
  refinement: { enabled: true, max_iters: 4, alloc_split: 0.5 }
  components:
    memory:        { enabled: false }
    reviewer:      { enabled: false }
    retrieval:     { enabled: false }
    tactic_skeletons: { enabled: false }

# After running: log numbers + GPU-hours in PROGRESS.md, write results/baseline/ curve + manifest.
