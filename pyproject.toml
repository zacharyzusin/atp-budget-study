[project]
name = "atp-budget-study"
version = "0.1.0"
description = "Budget-bounded agentic theorem proving: fixed-budget ablation + learned controller"
requires-python = ">=3.11"
dependencies = [
    # --- LIGHT CORE: pinned + installed in Task 0.1 (login-node safe, ~580MB env). ---
    # Versions frozen 2026-06-04 on Insomnia (python 3.11.15); see DECISIONS.md.
    "pydantic==2.13.4",     # config system + typed validation (chosen over omegaconf)
    "pyyaml==6.0.3",        # config file parsing
    "openai==2.41.0",       # client for the vLLM OpenAI-compatible endpoint
    "huggingface-hub==1.17.0",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "matplotlib==3.10.9",   # pass@B curves
    "rank-bm25==0.2.2",     # retrieval baseline
    "tenacity==9.1.4",      # retries around flaky Lean/server calls
]

[project.optional-dependencies]
# HEAVY GPU/LEAN STACK: deferred (multi-GB) until disk headroom is confirmed (Task 0.2/0.3).
# Pin exact versions when first installed and record them in DECISIONS.md.
gpu = [
    # Pinned 2026-06-06 (Task 0.3). HARD CONSTRAINT: l40s nodes run NVIDIA driver 550.54.14 = CUDA
    # 12.4, so torch MUST be a cu124 build (cu126/cu128/cu130 → "driver too old", cuda.is_available
    # False). vllm 0.8.5.post1 is the newest line that (a) ships torch 2.6.0+cu124 AND (b) supports
    # Qwen3 (Goedel-Prover-V2-8B is Qwen3ForCausalLM); vllm>=0.9 pulls torch 2.7+cu126 → won't run
    # here. transformers 4.51.3 (vllm 0.8.5 expects 4.51.x + has Qwen3; 5.x breaks vllm). Installing
    # this stack downgrades huggingface-hub (1.17→0.36, transformers caps <1.0) and numpy (2.4→2.2);
    # the LIGHT-CORE pins above are the login-node baseline, the GPU node carries these. flashinfer is
    # intentionally absent → vllm uses the xformers backend. See DECISIONS.md 2026-06-06.
    "torch==2.6.0",
    "vllm==0.8.5.post1",
    "transformers==4.51.3",
    "xformers==0.0.29.post2",
    "datasets",
]
lean = [
    # The GOEDEL-PIN verification backend needs NO Python package: it drives the version-matched
    # `leanprover-community/repl` exe (vendored in the mathlib build; `lake build repl`) over JSON on
    # stdio. See DECISIONS.md 2026-06-05 (supersedes the PyPantograph plan — PyPantograph has no
    # release matching Lean v4.9.0-rc1; its repl binary is toolchain-specific).
    #
    # pantograph is OPTIONAL and PLUMBING-ONLY: the quarantined v4.29.0 stack's PantographBackend.
    #   * 0.3.15 -> Lean v4.29.0 (matches the sibling project's prebuilt env).
    "pantograph==0.3.15",  # v4.29.0 plumbing/CI only; NOT used for any reported number.
]
train = [
    "trl",                  # Phase 2 GRPO/DPO (or replace with a minimal loop)
    "peft",                 # LoRA/QLoRA for Phase 2
]
dev = ["pytest==9.0.3", "pytest-timeout==2.4.0", "ruff==0.15.16", "pre-commit"]

[project.scripts]
atp = "atp.cli:main"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
# Put the repo root on sys.path so the five tests that import from `scripts.` collect. Without it,
# a bare `pytest` (what `make test` runs) fails collection on them with ModuleNotFoundError, while
# `python -m pytest` silently works because it adds the cwd itself -- so the breakage only showed
# up through the documented entry point. `scripts/` is a directory of standalone analysis programs,
# not an installed package, hence pythonpath rather than an __init__.py.
pythonpath = ["."]
markers = [
    "slow: tests that take more than a couple seconds",
    "gpu: tests that require a GPU",
    "lean: tests that require a working Lean/LeanDojo install",
]
# Fast suite (login-node safe) = run without slow/gpu/lean:
#   pytest -m "not slow and not gpu and not lean"
# Full suite (on a GPU node):
#   pytest

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# E501 only. Both files carry their overlong lines INSIDE triple-quoted templates, where a line
# break would change the emitted text -- and in both cases the exact text is load-bearing, so it
# must not be reflowed to satisfy a style rule:
#   decomposition.py       - the model-facing decomposition prompt. Its precise wording (including
#                            the "MORE THAN ONE such `have`" instruction) is the independent
#                            variable of the WS6 decomposition probe; see
#                            results/phase_decomp/DESIGN.md for the five rounds of prompt revision.
#   contamination_correlation.py - the generated Markdown report template. Reflowing it would
#                            silently change results/phase6/CONTAMINATION_CORRELATION.md on rerun.
# An inline `# noqa` is not an option inside a triple-quoted string: it would become part of the
# string. Everything else in these files is still linted.
"src/atp/agents/decomposition.py" = ["E501"]
"scripts/contamination_correlation.py" = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["atp*"]
