# configs/smoke.yaml — tiny end-to-end sanity run. Used by `make smoke` BEFORE any sbatch.
# Goal: exercise the full code path (model -> proposal -> Lean verify -> refine -> budget stop)
# on a handful of easy problems in an interactive session. Not for reporting numbers.

defaults: base            # config loader merges this on top of configs/base.yaml

data:
  benchmark: minif2f
  split: valid
  exclude_unprovable: true
  limit: 5                # only first 5 problems

budget:
  values: [4000]          # single small budget

eval:
  seeds: [0]              # single seed for smoke

agent:
  mode: whole_proof
  refinement: { enabled: true, max_iters: 2, alloc_split: 0.5 }
  components:
    memory:        { enabled: false }
    reviewer:      { enabled: false }
    retrieval:     { enabled: false }
    tactic_skeletons: { enabled: false }
